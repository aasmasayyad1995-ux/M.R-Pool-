# Fly.io.
#
#   fly launch --no-deploy --copy-config      # from this directory, pick a name
#   fly deploy
#
# Change app to the name fly launch gave you.
app = "mrpool-server"
primary_region = "bom"          # Mumbai: closest to the players

[build]
  dockerfile = "Dockerfile"

# The match server keeps no state between matches, so it needs no volume.

[http_service]
  internal_port = 8080
  force_https = true

  # Online play holds a WebSocket open for the length of a match, and a machine that
  # stopped underneath it would drop both players out of their game.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
