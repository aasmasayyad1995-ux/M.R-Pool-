# Render blueprint: https://render.com/docs/blueprint-spec
#
# In Render: New > Blueprint, pick this repository, leave "Blueprint Path" empty.
#
# The free tier suits this: the match server keeps no state between matches, so there is
# nothing a recycled container can lose.
services:
  - type: web
    name: mrpool-server
    runtime: docker
    # Both paths are relative to the repo root. rootDir is deliberately not used: with it
    # set, whether dockerfilePath is read from the repo root or from rootDir is ambiguous,
    # and getting it wrong fails the deploy in ten seconds with "Dockerfile not found".
    # dockerContext is what the Dockerfile's `COPY . .` actually copies.
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    plan: free
