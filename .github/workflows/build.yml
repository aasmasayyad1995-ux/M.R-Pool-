name: Build

# Every push builds the game and attaches the APK to the run, so it can be installed on a
# phone without anyone needing Android Studio.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Game
    runs-on: ubuntu-latest
    # Needed to publish the APK to the "latest" release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # The commit goes into the APK, so the lobby can say which build it is.
      #
      # matchServerUrl points the app at the deployed match server, which is what makes
      # "Play Online" work in the published build. It is a public address, not a secret.
      - name: Build the APK
        run: |
          ./gradlew assembleDebug \
            -PbuildId=${{ github.sha }} \
            -PmatchServerUrl=wss://mrpool-server.onrender.com/ws \
            --stacktrace

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: mr-pool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # An artifact is a zip, and it needs a GitHub login to fetch. A release asset is the
      # APK itself, downloadable in one tap from a phone, which is how this actually gets
      # installed and tested.
      - name: Publish the APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          NOTES="Debug build of $GITHUB_SHA, built automatically from main.
          The lobby shows \`build ${GITHUB_SHA:0:7}\` in its bottom corner, so you can
          tell at a glance which build a phone is actually running.

          Download **app-debug.apk** below, tap it on an Android phone and allow
          installation from unknown sources. Needs Android 7.0 or newer and OpenGL ES 3.0.

          Online play is switched on and points at the deployed match server. It runs
          on a free instance that sleeps when nobody is using it, so the first connect
          after a quiet spell can take up to a minute to wake it.

          Nothing in this app costs money. Coins are won by playing and cannot be
          bought."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest "$APK" --title "Latest build" --notes "$NOTES"
          fi

      - name: Attach the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  server:
    name: Match server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x server/gradlew

      - name: Tests
        working-directory: server
        run: ./gradlew test --stacktrace

      - name: Attach the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/
          if-no-files-found: ignore
