name: Build

# Every push builds the game and attaches the APK to the run, so it can be installed on a
# phone without anyone needing Android Studio.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build the APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: mr-pool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  server:
    name: Match server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x server/gradlew

      - name: Tests
        working-directory: server
        run: ./gradlew test --stacktrace

      - name: Attach the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/
          if-no-files-found: ignore
